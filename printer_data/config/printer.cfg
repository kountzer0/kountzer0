########################################
# POWER CONTROL & SAFE SHUTDOWN
########################################
# Qidi M8000/M8001 power-loss resume is not
# implemented in Klipper.
#
# This printer supports:
# - Controlled PSU shutdown via GPIO relay
# - Remote power on/off via Moonraker
#
# It does NOT support true print resume
# after unexpected power loss.
#
# Moonraker [power] is used only for
# PSU control, not job recovery.
########################################

