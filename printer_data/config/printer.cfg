# Optional: make the ramp linear from 50°C → 200°C
# Klipper will automatically interpolate fan_speed based on heater_temp
[heater_fan heatbreak_fan]
pin: PC7
heater: extruder

# Fan behavior
heater_temp: 50.0       # fan stays off below 50°C (good for PID calibration)
#fan_speed: 0.18         # minimum gentle airflow
fan_speed: 0.0          # turned off for PID
# speed at max_temp

