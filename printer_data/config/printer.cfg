resistance1: 103180
temperature2: 150
resistance2: 1366.2
temperature3: 250
resistance3: 168.6

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 7.0

heater_pin: PC8
sensor_type: Trianglelab-NTC100K-B3950
sensor_pin: PA0

control: pid
pid_Kp: 18.0  # lower proportional gain
pid_Ki: 0.9   # lower integral
pid_Kd: 120.0 # slightly higher derivative to damp overshoot

nozzle_diameter: 0.4
filament_diameter: 1.75
min_temp: 0
max_temp: 280



