[include mainsail.cfg]
[include macros/*.cfg]
#[include factory_mode.cfg]

#[save_variables]
#filename: ~/printer_data/config/mode_state.cfg
[save_variables]
filename: ~/printer_data/config/variables.cfg
########################################
# MACHINE
########################################

[virtual_sdcard]
path: ~/printer_data/gcodes

######### POWER CONTROLL ###############

[output_pin qidi_shutdown]
pin: PC12               # Or PC13
value: 1                # Idle high
shutdown_value: 1       # Stay high on shutdown

[gcode_macro SHUTDOWN_PRINTER]
description: Trigger Qidi relay shutdown signal
gcode:
  TURN_OFF_HEATERS
  M84
  RESPOND TYPE=command MSG="Sending shutdown signal..."
  SET_PIN PIN=qidi_shutdown VALUE=0
  G4 P500               # Brief pulse
  SET_PIN PIN=qidi_shutdown VALUE=1

######### printer config################

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_velocity: 200
max_accel: 2000
square_corner_velocity: 5.0

[force_move]
enable_force_move: true
	
########################################
# MCU
########################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3600590015504D5930393520-if00
restart_method: command

########################################
# X AXIS – SENSORLESS
########################################

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 33.8
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_min: 0
position_max: 300

########################################
# X HOMING BEHAVIOR (Chitu M8015 / M8016)
########################################

[stepper_x]
homing_speed: 30              # M8015 S
second_homing_speed: 5       # M8016 S
homing_retract_dist: 0

#[stepper_x]
#step_pin: PB13
#dir_pin: PB12
#enable_pin: !PB14
#microsteps: 16
#rotation_distance: 33.2
#endstop_pin: tmc2209_stepper_x:virtual_endstop
#position_endstop: 0
#position_min: 0
#position_max: 300
#homing_speed: 40
#homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.80
hold_current: 0.50
stealthchop_threshold: 0
diag_pin: ^PC0  # <<< CHECK THIS >>>
driver_SGTHRS: 85

########################################
# Y AXIS - SENSORLESS HOME CONFIG
########################################

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 33.8
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
position_max: 255
position_endstop: 0  # Home is at the minimum
homing_positive_dir: false

########################################
# Y HOMING BEHAVIOR (Chitu M8015 / M8016)
########################################

[stepper_y]
homing_speed: 60              # M8015 S
second_homing_speed: 15       # M8016 S
homing_retract_dist: 0

#[stepper_y]
#step_pin: PB10
#dir_pin: PB2
#enable_pin: !PB11
#microsteps: 16
#rotation_distance: 33.2
#endstop_pin: tmc2209_stepper_y:virtual_endstop
#position_min: 0
#position_max: 250
#position_endstop: 0  # Home is at the minimum
#homing_positive_dir: false
#homing_speed: 60
#homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 1.2      # Adjust based on motor specs
hold_current: 0.7
stealthchop_threshold: 0  # Depending on performance needs
diag_pin: ^PC1
#driver_SGTHRS: 140  # Adjust as needed based on testing
driver_SGTHRS: 110 # Adjust as needed based on testing

########################################
