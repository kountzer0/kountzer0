[include mainsail.cfg]
[include macros/*.cfg]
[include canbus.cfg]

[save_variables]
filename: ~/printer_data/config/variables.cfg

############################

# PRINTER CORE

############################

[printer]
kinematics: cartesian
max_velocity: 450
max_accel: 6750
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 5.0

[force_move]
enable_force_move: true

[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]

############################

# MCU

############################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3600590015504D5930393520-if00
restart_method: command

############################

# POWER RELAY

############################

[output_pin qidi_shutdown]
pin: PC12
value: 1
shutdown_value: 1

[gcode_macro SHUTDOWN_PRINTER]
gcode: TURN_OFF_HEATERS\nM84\nSET_PIN PIN=qidi_shutdown VALUE=0\nG4 P500\nSET_PIN PIN=qidi_shutdown VALUE=1



############################

# X AXIS (sensorless)

############################

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 33.8
endstop_pin: tmc2209_stepper_x:virtual_endstop
homing_positive_dir: true
position_endstop: 300
position_max: 300
position_min: 0

#position_endstop: 0
#position_min: 0
#position_max: 300
homing_speed: 30
second_homing_speed: 5
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.80
hold_current: 0.50
stealthchop_threshold: 0
diag_pin: ^PC0
driver_SGTHRS: 83

############################

# Y AXIS (sensorless)

############################

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 33.8
endstop_pin: tmc2209_stepper_y:virtual_endstop
#position_endstop: 0
#position_min: 0
#position_max: 255
#homing_positive_dir: false
homing_positive_dir: true
position_endstop: 250
position_max: 250
position_min: 0
homing_speed: 60
second_homing_speed: 15
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 1.2
hold_current: 0.7
stealthchop_threshold: 0
diag_pin: ^PC1
driver_SGTHRS: 109

############################

# Z AXIS (bed moving)

############################

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 32
rotation_distance: 8
endstop_pin: ^!PC2
position_min: -2
#position_endstop: 297.860
position_endstop = 298.405
position_max: 298.500
homing_speed: 6
second_homing_speed: 3
homing_retract_dist: 2
homing_positive_dir: true

############################

# BED LEVEL

############################


[bed_screws]
screw1: 30, 30.89
screw1_name: Front Left

screw2: 270, 30.89
screw2_name: Front Right

screw3: 150, 218.89
screw3_name: Rear Center

[bed_mesh]
speed: 80
horizontal_move_z: 20
mesh_min: 20, 20
mesh_max: 280, 230
probe_count: 3,3

############################

# ELECTRONICS COOLING

############################

[temperature_fan electronics_fan]
pin: PC6
sensor_type: temperature_mcu
min_temp: 0
max_temp: 80
target_temp: 45
control: watermark
min_speed: 0.3
max_speed: 1.0

############################

# BED

############################

[heater_bed]
heater_pin: PC9
sensor_type: Trianglelab-NTC100K-B3950
sensor_pin: PC4
control: pid
pid_Kp: 50.0
pid_Ki: 1.0
pid_Kd: 900.0
min_temp: 0
max_temp: 150

############################

# MISC

############################
[tftbridge]
tft_device: /dev/ttyUSB0
tft_baud: 250000
tft_timeout: 50
klipper_device: /home/kount/printer_data/comms/klippy.serial
klipper_baud: 250000
klipper_timeout: 50
[idle_timeout]
timeout: 600

[output_pin beeper]
pin: PB5

