#max_power: 0.5

#[gcode_macro TOGGLE_HOTEND_FAN]
#gcode:
  {% set fan_name = "hotend_fan" %}  # Must match your [heater_fan hotend_fan] section name exactly
  {% set fan = printer["heater_fan " ~ fan_name] %}  # Safer access using string concat
  {% if fan is defined and fan is not none %}
    {% set current_speed = fan.fan_speed|float %}
    RESPOND TYPE=command MSG="Current hotend fan speed: {current_speed * 100}%"
    {% if current_speed > 0 %}
      SET_FAN_SPEED FAN={fan_name} SPEED=0
      RESPOND TYPE=command MSG="Hotend fan turned OFF"
    {% else %}
      SET_FAN_SPEED FAN={fan_name} SPEED=1.0
      RESPOND TYPE=command MSG="Hotend fan turned ON at 100%"
    {% endif %}
  {% else %}
    RESPOND TYPE=command MSG="Error: Hotend fan '{fan_name}' not loaded or defined"
  {% endif %}

# Mainboard / electronics fan

[temperature_fan heatbreak_fan]
pin: PC7

sensor_type: Trianglelab-NTC100K-B3950
sensor_pin: PA0

control: pid
target_temp: 45.0

min_speed: 0.18
max_speed: 0.55

pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114

min_temp: 0
max_temp: 280

[sensor Trianglelab-NTC100K-B3950]
temperature1: 25
resistance1: 103180
temperature2: 150
resistance2: 1366.2
temperature3: 250
resistance3: 168.6


[temperature_fan electronics_fan]
pin: PC6
sensor_type: temperature_mcu
min_temp: 17
max_temp: 70
target_temp: 45
control: watermark
min_speed: 0.3
max_speed: 1.0

