[gcode_macro Z_SANITY_CHECK]
description: Ensure Z is homed before moving XY
gcode:
  {% if "z" not in printer.toolhead.homed_axes %}
    {action_raise_error("ERROR: Z axis is NOT homed! Cannot move XY or print. Run G28 Z first.")}
  {% else %}
    {action_respond_info("Z_SANITY_CHECK passed: Z is homed.")}
  {% endif %}
