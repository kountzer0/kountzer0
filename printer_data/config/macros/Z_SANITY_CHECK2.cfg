[gcode_macro Z_SANITY_CHECK]
description: Verify Z homing, direction, limits, and bed reference
gcode:
  RESPOND TYPE=command MSG="Starting Z sanity check..."

  # Step 1: Home Z only
  G28 Z
  G4 P500

  # Step 2: Confirm endstop state
  QUERY_ENDSTOPS
  RESPOND TYPE=command MSG="Z should be TRIGGERED at top after homing."

  # Step 3: Move to safe mid-height
  G0 Z250 F600
  RESPOND TYPE=command MSG="Moved to Z=250 (well above bed)."

  # Step 4: Move near bed (safe approach)
  G0 Z5 F300
  RESPOND TYPE=command MSG="Now at Z=5. Bed should be clearly visible below nozzle."

  # Step 5: Final approach for paper test
  G0 Z0.3 F120
  PAUSE MESSAGE="Z=0.3 reached. Use paper test. Jog Z ONLY (0.05 or 0.1 mm). Confirm nozzle just grips paper, then RESUME."

  # Step 6: Report final Z
  RESPOND TYPE=command MSG="Z sanity check complete. If paper grip occurred near Z≈0.1–0.2, Z is healthy."
