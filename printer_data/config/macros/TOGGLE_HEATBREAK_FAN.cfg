[gcode_macro TOGGLE_HEATBREAK_FAN]
gcode:
  {% set current = printer.heater_fan.extruder.fan_speed %}
  {% if current > 0 %}
    SET_HEATER_FAN FAN=heatbreak_fan VALUE=0
    RESPOND MSG="heatbreak fan OFF"
  {% else %}
    SET_HEATER_FAN FAN=heatbreak_fan VALUE=1.0
    RESPOND MSG="heatbreak fan ON"
  {% endif %}