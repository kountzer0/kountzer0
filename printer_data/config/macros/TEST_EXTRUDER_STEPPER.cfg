[gcode_macro TEST_EXTRUDER_STEPPER]
gcode:
  {% set amount = params.AMOUNT|default(10)|int %}
  {% set speed = params.SPEED|default(100)|int %}
  RESPOND TYPE=command MSG="Testing extruder stepper - cold extrude enabled"
  M302 S0  # Allow cold extrude
  M83  # Relative extruder mode
  G1 E{amount} F{speed}  # Extrude amount mm at speed mm/min
  RESPOND TYPE=command MSG="Extruder test complete"