[gcode_macro MANUAL_BED_LEVEL_QIDI]
gcode:
  G28
  M17
  G4 P1000
  RESPOND TYPE=command MSG="Manual bed leveling started (Qidi orientation)"

  # ---- FRONT LEFT ----
  G0 Z20 F3000
  G0 X300 Y250 F1500
  G0 Z0.2 F300
  PAUSE MESSAGE="FRONT LEFT: adjust screw, then press RESUME"

  # ---- FRONT RIGHT ----
  G0 Z20 F3000
  G0 X0 Y250 F1500
  G0 Z0.2 F300
  PAUSE MESSAGE="FRONT RIGHT: adjust screw, then press RESUME"

  # ---- REAR CENTER ----
  G0 Z20 F3000
  G0 X150 Y0 F1500
  G0 Z0.2 F300
  PAUSE MESSAGE="REAR CENTER: adjust screw, then press RESUME"

  G0 Z20 F3000
  RESPOND TYPE=command MSG="Manual bed leveling complete"
