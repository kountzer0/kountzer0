[gcode_macro MANUAL_BED_LEVEL_QIDI]
gcode:
  # --- Step 0: Homing & setup ---
  G28                         # Home all axes (Z bottom-endstop, X/Y back-right)
  M17                         # Ensure steppers enabled after homing
  G4 P1000                    # Wait 1 second to let homing settle
  RESPOND TYPE=command MSG="Starting manual bed leveling workflow"

  # --- Step 1: Front-left screw (X0 Y0) ---
  G0 Z10 F3000                # Lift Z for safe travel
  G0 X0 Y0 F1500              # Move to front-left slowly
  G0 Z0.2 F300                 # Lower close to bed for paper test
  PAUSE MESSAGE="Front-left (X0 Y0): Adjust screw with paper test. Press RESUME when done."
  SET_GCODE_OFFSET Z=0        # Record Z offset

  # --- Step 2: Front-right screw (X300 Y0) ---
  G0 Z10 F3000
  G0 X300 Y0 F1500
  G0 Z0.2 F300
  PAUSE MESSAGE="Front-right (X300 Y0): Adjust screw with paper test. Press RESUME when done."
  SET_GCODE_OFFSET Z=0

  # --- Step 3: Rear-center screw (X150 Y250) ---
  G0 Z10 F3000
  G0 X150 Y250 F1500
  G0 Z0.2 F300
  PAUSE MESSAGE="Rear-center (X150 Y250): Adjust screw with paper test. Press RESUME when done."
  SET_GCODE_OFFSET Z=0

  # --- Step 4: Save manual mesh ---
  G0 Z10 F3000
  BED_MESH_PROFILE SAVE NAME=manual_mesh
  RESPOND TYPE=command MSG="Manual mesh saved as 'manual_mesh'."

  # --- Step 5: Start gentle heatbreak fan ramp ---
  RESPOND TYPE=command MSG="Starting heatbreak fan ramp..."
  RUN_HEATBREAK_FAN_RAMP_ASYNC

  # --- Step 6: Park / Finish ---
  G28 X Y                     # Home X/Y to back-right corner
  M84                         # Disable steppers
  RESPOND TYPE=command MSG="Manual bed leveling workflow complete. Ready for PID calibration or print."
