[gcode_macro MANUAL_BED_LEVEL_QIDI]
description: Manual bed leveling for inverted Qidi Z
gcode:
  {% if "z" not in printer.toolhead.homed_axes %}
    RESPOND TYPE=error MSG=Z_not_homed
    CANCEL_PRINT
  {% endif %}

  G28
  M17
  G4 P500
  RESPOND MSG="Manual bed leveling started"

  {% set SAFE_Z = 20 %}
  {% set DROP_Z = -19.8 %}

  # ---- FRONT LEFT ----
  G90
  G0 Z{SAFE_Z} F3000
  G0 X120 Y180 F1500
  G91
  G0 Z{DROP_Z} F300
  PAUSE MESSAGE="FRONT LEFT: adjust screw, then RESUME"

  # ---- FRONT RIGHT ----
  G90
  G0 Z{SAFE_Z} F3000
  G0 X180 Y180 F1500
  G91
  G0 Z{DROP_Z} F300
  PAUSE MESSAGE="FRONT RIGHT: adjust screw, then RESUME"

  # ---- REAR CENTER ----
  G90
  G0 Z{SAFE_Z} F3000
  G0 X150 Y110 F1500
  G91
  G0 Z{DROP_Z} F300
  PAUSE MESSAGE="REAR CENTER: adjust screw, then RESUME"

  G90
  G0 Z{SAFE_Z} F3000
  RESPOND MSG="Manual bed leveling complete"
