[gcode_macro MANUAL_BED_LEVEL_QIDI]
description: "Guided manual bed leveling (Qidi inverted Z)"
gcode:
  Z_SANITY_CHECK
  SAFE_HOME_Z
  Z_REPORT

  RESPOND MSG="Starting manual bed leveling"

  G90
  G1 Z20 F3000

  RESPOND MSG="Front-left screw"
  G1 X7 Y0 F6000
  M0 Adjust screw, then click Resume

  RESPOND MSG="Front-right screw"
  G1 X294 Y4 F6000
  M0 Adjust screw, then click Resume

  RESPOND MSG="Rear screw"
  G1 X150 Y242 F6000
  M0 Adjust screw, then click Resume

  RESPOND MSG="Manual bed leveling complete"
