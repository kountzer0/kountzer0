[gcode_macro TOGGLE_PART_FAN]
gcode:
  {% set current_speed = printer.fan.speed %}
  {% if current_speed > 0 %}
    SET_FAN_SPEED FAN=part_fan SPEED=0
    RESPOND TYPE=command MSG="Part cooling fan turned OFF"
  {% else %}
    SET_FAN_SPEED FAN=part_fan SPEED=1.0  # Adjust to 0.5 for 50% speed, etc.
    RESPOND TYPE=command MSG="Part cooling fan turned ON at 100%"
  {% endif %}

[gcode_macro TOGGLE_HOTEND_FAN]
gcode:
  {% set current_speed = printer.heater_fan.hotend_fan.fan_speed %}
  {% if current_speed > 0 %}
    SET_HEATER_FAN FAN=hotend_fan VALUE=0
    RESPOND TYPE=command MSG="Hotend fan turned OFF"
  {% else %}
    SET_HEATER_FAN FAN=hotend_fan VALUE=1.0  # Adjust speed if needed
    RESPOND TYPE=command MSG="Hotend fan turned ON at 100%"
  {% endif %}