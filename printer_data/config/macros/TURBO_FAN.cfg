[gcode_macro TURBO_FAN]
description: Toggle auxiliary cooling fan
variable_state: 0
gcode:
    {% if printer["gcode_macro TURBO_FAN"].state == 0 %}
        SET_FAN_SPEED FAN=turbo SPEED=1.0
        SET_GCODE_VARIABLE MACRO=TURBO_FAN VARIABLE=state VALUE=1
        RESPOND MSG="Turbo fan: ON 🌪️"
    {% else %}
        SET_FAN_SPEED FAN=turbo SPEED=0
        SET_GCODE_VARIABLE MACRO=TURBO_FAN VARIABLE=state VALUE=0
        RESPOND MSG="Turbo fan: OFF"
    {% endif %}
