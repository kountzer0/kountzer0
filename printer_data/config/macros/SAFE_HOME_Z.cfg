[gcode_macro SAFE_HOME_Z]
description: Home Z with top endstop, then move to bed surface
gcode:
  {action_respond_info("Starting SAFE Z homing...")}

  # Home Z (moves toward endstop at top, sets position_endstop internally)
  G28 Z

  # Move down to bed (logical 0)
  G1 Z0 F3000

  {action_respond_info("Z homed safely and moved to 0 at bed surface.")}
