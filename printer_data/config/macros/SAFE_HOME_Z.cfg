[gcode_macro SAFE_HOME_Z]
gcode:
  {action_respond_info("Starting safe Z homing...")}

  # Move *safely*, but don't move XY yet
  G1 Z307 F6000  # just Z axis safe move

  # Home Z — sets Z position internally
  G28 Z

  # Now Z is homed, you can move XY
  G1 Z0 F3000  # move down to logical 0

  {action_respond_info("Z homed safely and moved to 0 at bed surface.")}

