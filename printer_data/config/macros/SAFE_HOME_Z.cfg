[gcode_macro SAFE_HOME_Z]
description: Home Z with endstop at top, then move to bed
gcode:
  {action_respond_info("Starting Z homing (top endstop)...")}

  # Home Z first — MUST do this before any absolute Z moves
  G28 Z

  # Now Z is homed at top (position_endstop = 297.3)
  # Move down to logical 0 (bed surface)
  G1 Z0 F3000

  {action_respond_info("Z homed at top, moved down to 0 at bed surface.")}
