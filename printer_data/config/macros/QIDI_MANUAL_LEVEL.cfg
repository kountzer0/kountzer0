[gcode_macro QIDI_MANUAL_LEVEL]
gcode:
  RESPOND TYPE=command MSG="Qidi manual bed leveling - Z=0 is top, Z=300 is bed"
  G28                            # Home all (Z moves down to endstop at Z=300)
  G0 Z10 F3000                   # Lift 10 mm above bed for safe travel

  # Screw 1: X10 Y240 - back-left
  G0 X10 Y240 F6000
  G0 Z0.2 F300                   # Paper test height (0.2 mm above bed)
  RESPOND TYPE=command MSG="Screw 1: back-left (X10 Y240) - adjust with paper drag. Click RESUME when done."
  PAUSE

  # Screw 2: X290 Y240 - back-right
  G0 Z10 F3000
  G0 X290 Y240 F6000
  G0 Z0.2 F300
  RESPOND TYPE=command MSG="Screw 2: back-right (X290 Y240) - adjust. Click RESUME."
  PAUSE

  # Screw 3: X120 Y10 - front-center
  G0 Z10 F3000
  G0 X120 Y10 F6000
  G0 Z0.2 F300
  RESPOND TYPE=command MSG="Screw 3: front-center (X120 Y10) - adjust. Click RESUME."
  PAUSE

  # Optional center check (not a screw, but good for flatness)
  G0 Z10 F3000
  G0 X150 Y150 F6000
  G0 Z0.2 F300
  RESPOND TYPE=command MSG="Center check (X150 Y150) - final tweak. Click RESUME when happy."
  PAUSE

  # Finish - lift and center
  G0 Z50 F3000
  G0 X150 Y150 F6000
  RESPOND TYPE=command MSG="Manual leveling complete - ready for test print"