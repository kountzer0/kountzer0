[gcode_macro MANUAL_BED_LEVEL_QIDI_FINAL]
gcode:
  RESPOND TYPE=command MSG="Starting manual bed leveling (Qidi orientation)"

  # --- Home & settle ---
  G28
  M17
  G4 P1000

  # ======================
  # FRONT LEFT SCREW
  # ======================
  G0 Z20 F3000
  G0 X300 Y250 F1500
  G0 Z0.2 F300
  M400
  PAUSE MESSAGE="FRONT LEFT: adjust screw with paper, then press RESUME"

  # ======================
  # FRONT RIGHT SCREW
  # ======================
  G0 Z20 F3000
  G0 X0 Y250 F1500
  G0 Z0.2 F300
  M400
  PAUSE MESSAGE="FRONT RIGHT: adjust screw with paper, then press RESUME"

  # ======================
  # REAR CENTER SCREW
  # ======================
  G0 Z20 F3000
  G0 X150 Y0 F1500
  G0 Z0.2 F300
  M400
  PAUSE MESSAGE="REAR CENTER: adjust screw with paper, then press RESUME"

  # --- Finish ---
  G0 Z30 F3000
  RESPOND TYPE=command MSG="Manual bed leveling complete"
