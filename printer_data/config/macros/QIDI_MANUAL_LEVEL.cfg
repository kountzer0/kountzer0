[gcode_macro QIDI_MANUAL_LEVEL]
gcode:
  RESPOND TYPE=command MSG="Qidi manual bed leveling started - Z=0 is TOP, Z=300 is bottom"
  G28                            # Home all (Z will go to bottom = Z=300)
  G0 Z10 F3000                   # Lift 10 mm from bottom for safe travel
  M84                            # Disable steppers so you can move head manually if needed

  # Front-left screw (closest to you on the left)
  G0 X30 Y30 F6000
  G0 Z5 F3000
  G0 Z0.2 F300               # Z=0.2 mm from top (paper test height)
  RESPOND TYPE=command MSG="Front-left screw (X30 Y30) - adjust until paper has slight drag. Click RESUME when done."
  PAUSE

  # Front-right screw
  G0 Z10 F3000
  G0 X270 Y30 F6000         # Adjust X if your bed is 300x300 (270 = 300-30)
  G0 Z0.2 F300
  RESPOND TYPE=command MSG="Front-right screw (X270 Y30) - adjust. Click RESUME."
  PAUSE

  # Rear-right screw
  G0 Z10 F3000
  G0 X270 Y270 F6000
  G0 Z0.2 F300
  RESPOND TYPE=command MSG="Rear-right screw (X270 Y270) - adjust. Click RESUME."
  PAUSE

  # Rear-left screw
  G0 Z10 F3000
  G0 X30 Y270 F6000
  G0 Z0.2 F300
  RESPOND TYPE=command MSG="Rear-left screw (X30 Y270) - adjust. Click RESUME."
  PAUSE

  # Center (optional final check)
  G0 Z10 F3000
  G0 X150 Y150 F6000
  G0 Z0.2 F300
  RESPOND TYPE=command MSG="Center check (X150 Y150) - final adjustment. Click RESUME when happy."
  PAUSE

  # Done - park safely
  G0 Z50 F3000
  G0 X150 Y150 F6000
  RESPOND TYPE=command MSG="Qidi manual bed leveling complete! Ready for mesh or test print."