[gcode_macro MANUAL_BED_LEVEL_SAFE]
description: Manual bed leveling using bed_screws coordinates (Qidi bottom-endstop safe)
gcode:
  # --- Step 0: Home safely ---
  G28                         # Home all axes (Z bottom, X/Y back-right)
  M17                         # Ensure steppers enabled
  G4 P1000                    # Let homing fully settle
  RESPOND TYPE=command MSG="Starting manual bed leveling (bed_screws based)"

  # --- Screw 1: Front-left (7,0) ---
  G0 Z{min(30, printer.toolhead.axis_maximum.z - 2)} F3000 # horizontal_move_z equivalent
  G0 X7 Y0 F1500
  G0 Z0.2 F300
  PAUSE MESSAGE="Front-left screw (X7 Y0). Paper test, adjust screw, then RESUME."
  SET_GCODE_OFFSET Z=0

  # --- Screw 2: Front-right (294,4) ---
  G0 Z{min(30, printer.toolhead.axis_maximum.z - 2)} F3000
  G0 X294 Y4 F1500
  G0 Z0.2 F300
  PAUSE MESSAGE="Front-right screw (X294 Y4). Paper test, adjust screw, then RESUME."
  SET_GCODE_OFFSET Z=0

  # --- Screw 3: Rear-center (150,242) ---
  G0 Z{min(30, printer.toolhead.axis_maximum.z - 2)} F3000
  G0 X150 Y242 F1500
  G0 Z0.2 F300
  PAUSE MESSAGE="Rear-center screw (X150 Y242). Paper test, adjust screw, then RESUME."
  SET_GCODE_OFFSET Z=0

  # --- Finish up ---
  G0 Z{min(30, printer.toolhead.axis_maximum.z - 2)} F3000
  BED_MESH_PROFILE SAVE NAME=manual_mesh
  RESPOND TYPE=command MSG="Manual mesh saved as 'manual_mesh'."

  G28 X Y                     # Re-home X/Y only
  M84                         # Disable steppers
  RESPOND TYPE=command MSG="Manual bed leveling complete. Ready for PID or printing."
