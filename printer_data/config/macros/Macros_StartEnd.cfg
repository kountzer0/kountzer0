############################################################
# PRE PRINT Z GUARD (keep if you already have it — included
# here for completeness so everything lives together)
############################################################

[gcode_macro PRE_PRINT_Z_GUARD]
description: Guard against unsafe Z before print
gcode:
  {% if "z" not in printer.toolhead.homed_axes %}
    RESPOND TYPE=error MSG=Z_not_homed_aborting_print
    CANCEL_PRINT
  {% endif %}

  {% set z = printer.toolhead.position.z|float %}
  {% set Z_MIN_SAFE = 5.0 %}
  {% set Z_MAX_SAFE = 305.0 %}

  {% if z < Z_MIN_SAFE %}
    RESPOND TYPE=error MSG=Z_TOO_CLOSE_TO_BED_ABORTING_PRINT
    CANCEL_PRINT
  {% elif z > Z_MAX_SAFE %}
    RESPOND TYPE=error MSG=Z_ABOVE_MECHANICAL_LIMIT_ABORTING_PRINT
    CANCEL_PRINT
  {% else %}
    RESPOND MSG=Z_preflight_OK
  {% endif %}


############################################################
# START PRINT — PRODUCTION GRADE
############################################################

[gcode_macro START_PRINT]
description: Stable startup for inverted Qidi with heat soak + mesh
gcode:

    {% set first_layer_temp = params.FIRSTLAYERTEMP|default(210)|float %}
    {% set first_layer_bed_temp = params.FIRSTLAYERBEDTEMP|default(60)|float %}
    {% set first_layer_height = params.FIRSTLAYERHEIGHT|default(0.2)|float %}

    #################################################
    # Begin Bed Heating Immediately
    #################################################
    M140 S{first_layer_bed_temp}

    #################################################
    # Establish Coordinate Reality
    #################################################
    G28 X Y
    G28 Z
    G1 Z10 F600
    G90

    PRE_PRINT_Z_GUARD

    #################################################
    # Park Away From Mesh Zone (prevents heat plume)
    #################################################
    G0 X40 Y5 Z50 F4000

    #################################################
    # Thermal Stabilization (CRITICAL)
    #################################################
    M190 S{first_layer_bed_temp}
    G4 S180

    #################################################
    # Mesh Activation
    #################################################
    BED_MESH_CLEAR
    BED_MESH_PROFILE LOAD=default

    #################################################
    # Heat Nozzle AFTER Mesh (reduces ooze artifacts)
    #################################################
    M104 S{first_layer_temp}
    M109 S{first_layer_temp}

    #################################################
    # Prime Ritual
    #################################################
    G0 X270 Y5 F4000
    G0 Z{first_layer_height} F900

    G92 E0
    G1 E8 F400
    G92 E0

    G1 X260 Y5 E1.5 F1800
    G92 E0
    G1 X5 E25 F900


############################################################
# END PRINT — SAFE + PROFESSIONAL
############################################################

[gcode_macro END_PRINT]
description: Controlled cooldown and safe park
gcode:

    #################################################
    # Shut Down Heaters
    #################################################
    M104 S0
    M140 S0

    #################################################
    # Retract Slightly
    #################################################
    G92 E0
    G1 E-2 F300

    #################################################
    # Lift BEFORE moving (prevents scars)
    #################################################
    G91
    G1 Z10 F600
    G90

    #################################################
    # Park Bed
    #################################################
    G28 Z

    #################################################
    # Controlled Hotend Cooling
    #################################################
    M106 S200
    M109 R150
    M106 S0

    #################################################
    # Release Motors
    #################################################
    M84
