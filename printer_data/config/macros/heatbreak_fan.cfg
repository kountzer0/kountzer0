##[fan]
#pin: PC7
# Optional: set default startup speed (0-1)
# default_power: 0.0   # optional
# pwm: True            # PWM is implied on most pins

[gcode_macro HEATBREAK_FAN]
gcode:
    {% set t = printer.extruder.temperature %}
    {% set speed = (t - 40) / (200 - 40) %}
    {% if speed < 0.18 %}
        {% set speed = 0.18 %}
    {% endif %}
    {% if speed > 0.55 %}
        {% set speed = 0.55 %}
    {% endif %}
    SET_FAN_SPEED FAN=fan SPEED={speed}
