[gcode_macro HEATBREAK_FAN]
gcode:
    {% set t = printer['extruder'].temperature %}
    # Linear ramp: 40°C → 200°C
    {% set speed = (t - 40) / (200 - 40) %}
    {% if speed < 0.18 %} {% set speed = 0.18 %} {% endif %}  # fan stall floor
    {% if speed > 0.55 %} {% set speed = 0.55 %} {% endif %}  # max safe airflow
    SET_FAN_SPEED FAN=heatbreak_fan SPEED={{speed}}
