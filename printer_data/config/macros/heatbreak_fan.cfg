[output_pin heatbreak_fan]
pin: PC7
pwm: True
pwm_freq: 25000  # high frequency for maglev fan
scale: 1.0

[gcode_macro HEATBREAK_FAN]
gcode:
    {% set t = printer.extruder.temperature %}
    {% set speed = (t - 40) / (200 - 40) %}
    {% if speed < 0.18 %}
        {% set speed = 0.18 %}
    {% endif %}
    {% if speed > 0.55 %}
        {% set speed = 0.55 %}
    {% endif %}
    SET_PIN PIN=heatbreak_fan VALUE={speed}

