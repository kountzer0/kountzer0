[gcode_macro PREFLIGHT_CHECK]
description: Full Z preflight and manual bed leveling bundle
gcode:
  # Step 1: Report Z state
  {action_respond_info("===== PREFLIGHT CHECK START =====")}
  {action_respond_info("Reporting current Z state...")}
  {action_respond_info("Current Z: " ~ printer.toolhead.position.z)}
  QUERY_ENDSTOPS

  # Step 2: Ensure Z is homed
  {% if "z" not in printer.toolhead.homed_axes %}
    {action_raise_error("ERROR: Z axis is NOT homed! Run G28 Z first.")}
  {% else %}
    {action_respond_info("Z_SANITY_CHECK passed: Z is homed.")}
  {% endif %}

  # Step 3: Guided manual bed leveling (pauses at each screw)
  {action_respond_info("Starting guided manual bed leveling...")}

  # Front-left screw
  G0 Z30 F3000
  G0 X7 Y0 F1500
  G0 Z0.2 F300
  PAUSE MESSAGE="Front-left screw: paper test. Adjust screw, then RESUME."

  # Front-right screw
  G0 Z30 F3000
  G0 X294 Y4 F1500
  G0 Z0.2 F300
  PAUSE MESSAGE="Front-right screw: paper test. Adjust screw, then RESUME."

  # Rear-center screw
  G0 Z30 F3000
  G0 X150 Y242 F1500
  G0 Z0.2 F300
  PAUSE MESSAGE="Rear-center screw: paper test. Adjust screw, then RESUME."

  # Finish leveling
  G0 Z30 F3000
  BED_MESH_PROFILE SAVE NAME=manual_mesh
  G28 X Y
  M84
  {action_respond_info("Manual bed leveling complete. Mesh saved as 'manual_mesh'.")}

  # Step 4: Check Z limits before printing
  {% set z = printer.toolhead.position.z %}
  {% set zmin = printer.configfile.settings.stepper_z.position_min %}
  {% set zmax = printer.configfile.settings.stepper_z.position_max %}
  {% if z < zmin or z > (zmax - 2) %}
    {action_raise_error("ERROR: Z = " ~ z ~ " is out of safe range! Adjust Z before printing.")}
  {% else %}
    {action_respond_info("Z_LIMITS_GUARD passed: Z = " ~ z ~ " is within safe range.")}
  {% endif %}

  {action_respond_info("===== PREFLIGHT CHECK COMPLETE =====")}
