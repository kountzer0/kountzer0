[gcode_macro TOGGLE_HOTEND_FAN]
gcode:
  {% set current = printer.heater_fan.hotend_fan.fan_speed %}
  {% if current > 0 %}
    SET_HEATER_FAN FAN=hotend_fan VALUE=0
    RESPOND MSG="Hotend fan OFF"
  {% else %}
    SET_HEATER_FAN FAN=hotend_fan VALUE=1.0
    RESPOND MSG="Hotend fan ON"
  {% endif %}