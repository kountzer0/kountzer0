[gcode_macro PRE_PRINT_Z_GUARD]
description: "Guard against unsafe Z state before print"
gcode:
  {% if "z" not in printer.toolhead.homed_axes %}
    RESPOND TYPE=error MSG="Z not homed. Cannot start print."
    CANCEL_PRINT
  {% endif %}

  {% set z = printer.toolhead.position.z %}

  {% if z < 1.0 %}
    RESPOND TYPE=error MSG={{ "Z too low (" ~ (z|round(3)) ~ " mm). Possible collision risk." }}
    CANCEL_PRINT
  {% elif z > 295 %}
    RESPOND TYPE=error MSG={{ "Z too high (" ~ (z|round(3)) ~ " mm). Near endstop." }}
    CANCEL_PRINT
  {% else %}
    RESPOND MSG={{ "Z preflight OK (" ~ (z|round(2)) ~ " mm)" }}
  {% endif %}
