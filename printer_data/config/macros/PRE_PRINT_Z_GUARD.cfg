[gcode_macro PRE_PRINT_Z_GUARD]
description: Guard against unsafe Z before print
gcode:
  {% if "z" not in printer.toolhead.homed_axes %}
    RESPOND TYPE=error MSG=Z_not_homed_aborting_print
    CANCEL_PRINT
  {% endif %}

  {% set z = printer.toolhead.position.z|float %}

  {% if z < 1.0 %}
    RESPOND TYPE=error MSG=Z_TOO_LOW_ABORTING_PRINT
    CANCEL_PRINT
  {% elif z > 295.0 %}
    RESPOND TYPE=error MSG=Z_TOO_HIGH_ABORTING_PRINT
    CANCEL_PRINT
  {% else %}
    RESPOND MSG=Z_preflight_OK
  {% endif %}
