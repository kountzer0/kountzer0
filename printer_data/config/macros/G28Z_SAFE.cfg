[gcode_macro G28Z_SAFE]
gcode:
  {action_respond_info("Starting safe Z homing...")}

  # Move up 10mm above endstop to avoid hitting frame
  G1 Z307 F6000

  # Home Z (moves toward endstop at 297.3)
  G28 Z

  # Move down to logical Z=0 (bed surface)
  G1 Z0 F3000

  {action_respond_info("Z homed safely and moved to 0 at bed surface.")}
