[gcode_macro _HEATBREAK_FAN_SAFETY_CHECK]
gcode:
    {% if printer.extruder.temperature > 50 %}
        RESPOND TYPE=error MSG="Heatbreak fan cannot be disabled while hot!"
        CANCEL_PRINT
    {% endif %}

[gcode_macro HEATBREAK_FAN_FORCE_ON]
description: Force heatbreak fan on by lowering trigger temp
gcode:
    SET_HEATER_FAN_TARGET FAN=heatbreak_fan TARGET=0
    RESPOND MSG="Heatbreak fan forced ON"


[gcode_macro HEATBREAK_FAN_AUTO]
description: Return heatbreak fan to automatic heater control
gcode:
    {% if printer.extruder.temperature > 50 %}
        RESPOND TYPE=error MSG="Hotend too warm to release manual fan safely!"
    {% else %}
        SET_FAN_SPEED FAN=heatbreak_fan SPEED=0
        RESPOND MSG="Heatbreak fan returned to AUTO mode"
    {% endif %}

[gcode_macro HEATBREAK_FAN_STATUS]
description: Report heatbreak fan state
gcode:
    {% set temp = printer.extruder.temperature|float %}
    RESPOND MSG="Hotend temp: {temp}C | Heater fan is automatic above 50C"

[gcode_macro HEATBREAK_FAN_EMERGENCY]
description: Force cooling until hotend is safe
gcode:
    SET_FAN_SPEED FAN=heatbreak_fan SPEED=1.0
    RESPOND MSG="Emergency cooling active"

