[gcode_macro Z_REPORT]
description: Report Z axis state
gcode:
  {action_respond_info("Z_REPORT_START")}

  {% if "z" in printer.toolhead.homed_axes %}
    {action_respond_info("Z_HOMED")}
  {% else %}
    {action_respond_info("Z_NOT_HOMED")}
  {% endif %}

  {action_respond_info("Z_POSITION " ~ printer.toolhead.position.z)}

  {action_respond_info("Z_MIN " ~ printer.configfile.settings.stepper_z.position_min)}
  {action_respond_info("Z_MAX " ~ printer.configfile.settings.stepper_z.position_max)}

  QUERY_ENDSTOPS

  {action_respond_info("Z_REPORT_END")}
