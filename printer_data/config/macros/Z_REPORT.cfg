[gcode_macro Z_REPORT]
description: Report Z axis state
gcode:
  RESPOND TYPE=command MSG=Z_REPORT_START

  {% if "z" in printer.toolhead.homed_axes %}
    RESPOND TYPE=command MSG=Z_HOMED
  {% else %}
    RESPOND TYPE=error MSG=Z_NOT_HOMED
  {% endif %}

  RESPOND TYPE=command MSG=Z_POSITION
  RESPOND TYPE=command MSG={{ printer.toolhead.position.z }}

  RESPOND TYPE=command MSG=Z_MIN
  RESPOND TYPE=command MSG={{ printer.configfile.settings.stepper_z.position_min }}

  RESPOND TYPE=command MSG=Z_MAX
  RESPOND TYPE=command MSG={{ printer.configfile.settings.stepper_z.position_m
