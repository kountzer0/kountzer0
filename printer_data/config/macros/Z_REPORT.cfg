[gcode_macro Z_REPORT]
description: "Report current Z position and limits"
gcode:
  {% set z = printer.toolhead.position.z %}
  RESPOND MSG="Z position: {{ z|round(3) }} mm"
  RESPOND MSG="Z min: {{ printer.configfile.settings.stepper_z.position_min }}"
  RESPOND MSG="Z max: {{ printer.configfile.settings.stepper_z.position_max }}"
