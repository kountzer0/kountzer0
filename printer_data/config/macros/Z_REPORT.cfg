[gcode_macro Z_REPORT]
description: Report Z axis state, limits, and endstop status
gcode:
  RESPOND TYPE=command MSG="----- Z REPORT START -----"

  {% if "z" in printer.toolhead.homed_axes %}
    RESPOND TYPE=command MSG="Z is homed"
  {% else %}
    RESPOND TYPE=error MSG="Z is NOT homed"
  {% endif %}

  RESPOND TYPE=command MSG="Current Z position: {{ printer.toolhead.position.z }}"

  RESPOND TYPE=command MSG="Z minimum: {{ printer.configfile.settings.stepper_z.position_min }}"
  RESPOND TYPE=command MSG="Z maximum: {{ printer.configfile.settings.stepper_z.position_max }}"

  QUERY_ENDSTOPS
  RESPOND TYPE=command MSG="Z endstop should only trigger at the top of travel"

  {% if printer.toolhead.position.z < 1 %}
    RESPOND TYPE=command MSG="Z is very close to the bed"
  {% elif printer.toolhead.position.z > 200 %}
    RESPOND TYPE=command MSG="Z is high (safe travel zone)"
  {% else %}
    RESPOND TYPE=command MSG="Z is mid travel"
  {% endif %}

  RESPOND TYPE=command MSG="----- Z REPORT END -----"
