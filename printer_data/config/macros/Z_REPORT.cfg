[gcode_macro Z_REPORT]
description: Report current Z position safely
gcode:
    {% if "z" not in printer.toolhead.homed_axes %}
        M118 Z not homed
    {% else %}
        {% set z = printer.toolhead.position.z|float %}
        M118 Z position: { "%.3f" % z }
        {# or: M118 Z position: { z|round(3) } #}
    {% endif %}