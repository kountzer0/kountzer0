[gcode_macro Z_REPORT]
description: Report Z axis state, limits, and endstop status
gcode:
  RESPOND TYPE=command MSG="----- Z REPORT START -----"

  # Homing state
  {% if printer.toolhead.homed_axes is not defined or "z" not in printer.toolhead.homed_axes %}
    RESPOND TYPE=error MSG="Z is NOT homed!"
  {% else %}
    RESPOND TYPE=command MSG="Z is homed."
  {% endif %}

  # Current Z position
  RESPOND TYPE=command MSG="Current Z position: {{ '%.3f'|format(printer.toolhead.position.z) }} mm"

  # Z limits
  RESPOND TYPE=command MSG="Z minimum: {{ printer.configfile.settings.stepper_z.position_min }} mm"
  RESPOND TYPE=command MSG="Z maximum: {{ printer.configfile.settings.stepper_z.position_max }} mm"

  # Endstop state
  QUERY_ENDSTOPS
  RESPOND TYPE=command MSG="Z endstop should be TRIGGERED only near top of travel."

  # Sanity hints
  {% if printer.toolhead.position.z < 1.0 %}
    RESPOND TYPE=command MSG="Z is near the bed (normal for leveling/printing)."
  {% elif printer.toolhead.position.z > 200 %}
    RESPOND TYPE=command MSG="Z is high up (safe travel zone)."
  {% else %}
    RESPOND TYPE=command MSG="Z is mid-travel."
  {% endif %}

  RESPOND TYPE=command MSG="----- Z REPORT END -----"
