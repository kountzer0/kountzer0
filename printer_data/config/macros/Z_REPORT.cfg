[gcode_macro Z_REPORT]
description: Report current Z position safely
gcode:
  {% if "z" not in printer.toolhead.homed_axes %}
    M118 Z not homed
  {% else %}
    {% set z = (printer.toolhead.position.z|float)|round(3) %}
    {% set line = "M118 Z position: " ~ z %}
    {{ line }}
  {% endif %}
