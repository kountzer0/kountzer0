[probe]
pin: ^!EBB:PB8
x_offset: -43.5
y_offset: +5
z_offset: 1.244
speed: 5
samples: 2

[output_pin microprobe_ctrl]
pin: EBB:PB9
value: 0
shutdown_value: 0

[gcode_macro PROBE_DOWN]
gcode:
    SET_PIN PIN=microprobe_ctrl VALUE=1
    G4 P500
[gcode_macro PROBE_UP]
gcode:
    SET_PIN PIN=microprobe_ctrl VALUE=1
    G4 P100
    SET_PIN PIN=microprobe_ctrl VALUE=0