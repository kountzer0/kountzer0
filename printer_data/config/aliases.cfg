# --------------------------------------------------
# G-code compatibility aliases
# Purpose: absorb Marlin / slicer noise safely
# No motion, temp, or EEPROM side effects
# --------------------------------------------------
########################################
# G-code Compatibility / Alias Macros
########################################

# --- Object exclusion (Orca / Prusa / Cura) ---
[gcode_macro EXCLUDE_OBJECT_START]
gcode:
    # Ignored safely

[gcode_macro EXCLUDE_OBJECT_END]
gcode:
    # Ignored safely

[gcode_macro EXCLUDE_OBJECT_DEFINE]
gcode:
    # Ignored safely


# --- Marlin linear advance (use Klipper PA instead) ---
[gcode_macro M900]
gcode:
    # Linear Advance ignored (use pressure_advance)


# --- Fan aliases ---
[gcode_macro M106]
gcode:
    {% if params.S is defined %}
        SET_FAN_SPEED FAN=fan SPEED={{ params.S|float / 255.0 }}
    {% else %}
        SET_FAN_SPEED FAN=fan SPEED=1.0
    {% endif %}

[gcode_macro M107]
gcode:
    SET_FAN_SPEED FAN=fan SPEED=0


# --- Acceleration / Jerk commands (ignored or logged) ---
[gcode_macro M204]
gcode:
    # Acceleration command ignored (Klipper uses config values)

[gcode_macro M205]
gcode:
    # Jerk / advanced settings ignored


# --- SD card / LCD noise ---
[gcode_macro M20]
gcode:
    # List SD card ignored

[gcode_macro M21]
gcode:
    # Init SD card ignored

[gcode_macro M23]
gcode:
    # Select SD file ignored

[gcode_macro M24]
gcode:
    # Start SD print ignored

[gcode_macro M25]
gcode:
    # Pause SD print ignored


# --- EEPROM commands ---
[gcode_macro M500]
gcode:
    # Save settings ignored

[gcode_macro M501]
gcode:
    # Load settings ignored

[gcode_macro M503]
gcode:
    # Report settings ignored


# --- Temperature wait aliases (optional but common) ---
[gcode_macro M109]
rename_existing: M109.1
gcode:
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={params.S|float}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={params.S|float}

[gcode_macro M190]
rename_existing: M190.1
gcode:
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={params.S|float}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={params.S|float}
