# --------------------------------------------------
# FrankenQidi G-code compatibility aliases
# Purpose: silence common slicer / Marlin chatter
# Safe: no motion or homing behaviour altered
# --------------------------------------------------

##########
# Fan control (Marlin → Klipper)
##########

[gcode_macro M106]
rename_existing: M106.1
gcode:
    {% set speed = (params.S|default(255)|float) / 255.0 %}
    SET_FAN_SPEED FAN=fan SPEED={speed}

[gcode_macro M107]
rename_existing: M107.1
gcode:
    SET_FAN_SPEED FAN=fan SPEED=0


