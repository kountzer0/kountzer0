############################

# EBB36 TOOLHEAD (CAN)

############################

[mcu EBB]
canbus_uuid: f343c0eac398

############################

# THERMISTOR TABLE

############################

[thermistor Trianglelab-NTC100K-B3950]
temperature1: 25
resistance1: 103180
temperature2: 150
resistance2: 1366.2
temperature3: 250
resistance3: 168.6

############################

# EXTRUDER

############################

[extruder]
step_pin: EBB:PB3
dir_pin: !EBB:PB4
enable_pin: !EBB:PD1
microsteps: 16
rotation_distance: 7.0

heater_pin: EBB:PB13
sensor_type: Trianglelab-NTC100K-B3950
sensor_pin: EBB:PA0

nozzle_diameter: 0.4
filament_diameter: 1.75

pressure_advance: 0.06
pressure_advance_smooth_time: 0.04

control: pid
min_temp: 0
max_temp: 280

############################

# HEATBREAK FAN (AUTO)

############################

[heater_fan heatbreak_fan]
pin: EBB:PC7
heater: extruder
heater_temp: 50
fan_speed: 1.0

############################

# PART COOLING FAN

############################

[fan]
pin: EBB:PB15

