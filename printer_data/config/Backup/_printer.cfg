# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication/USART.

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.
[include mainsail.cfg]
#[bltouch]
#sensor_pin: ^PC14 #Remove ^ if print head crashes into bed, the ^ is for the CR touch a bl touch should work without.
#control_pin: PA1
#x_offset: -40
#y_offset: -10
#z_offset: 3.0
#speed:
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3600590015504D5930393520-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 7000          # start lower (~3000-5000) and tune up
max_z_velocity: 25
max_z_accel: 200
square_corner_velocity: 5.0

[gcode_button power_button]
pin: ^PC13
press_gcode:
    TOGGLE_PSU

[force_move]
enable_force_move: true

#[safe_z_home]
#home_xy_position: 115,115 # Change coordinates to the center of your print bed
#speed: 50
#z_hop: 10                 # Move up 10mm
#z_hop_speed: 5

#[bed_mesh]
#speed: 120
#horizontal_move_z: 5
#mesh_min: 10, 10
#mesh_max: 190, 220
#probe_count: 5,5

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 33.2        # same as X on stock QIDI CoreXY
endstop_pin: ^!PC0              # stock Y limit switch
#microsteps: 16
#rotation_distance: 33.8
#position_endstop: 0
#position_max: 300
#homing_speed: 30
#endstop_pin: ^!PC0
position_endstop: 0
position_max: 300
homing_speed: 20
homing_retract_dist: 10

#homing_positive_dir: False

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 1.0               # 0.9–1.15 common on QIDI stock motors
stealthchop_threshold: 999999  # or 0 to disable stealthchop

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 33.9552
endstop_pin: ^!PC1
position_endstop: 0
position_max: 250
homing_speed: 20
homing_retract_dist: 10

#homing_positive_dir: False

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 1.0
stealthchop_threshold: 999999

#grok edit#
#[stepper_z]
#step_pin: PB1
#dir_pin: PB0
#enable_pin: !PB2
#microsteps: 16
#rotation_distance: 8
#endstop_pin: ^PC2
#position_endstop: 0.0
#position_max: 300
#homing_speed: 10
#homing_retract_dist: 5

#[stepper_z1]
#step_pin: PA15
#dir_pin: PA8
#enable_pin: !PA9
#microsteps: 16
#rotation_distance: 8
# No endstop here—relies on stepper_z's

# my oriiganal #
[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: !PC2
position_min: 0
position_endstop: 0.0
position_max: 300
homing_speed: 10
homing_retract_dist: 10

#endstop_pin: probe:z_virtual_endstop
#position_max: 300
#position_min: 0
#homing_speed: 10
#homing_retract_dist: 5


#homing_positive_dir: False

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 1.1  # Z usually needs more current
stealthchop_threshold: 999999

[homing_override]
axes: xyz
gcode:
    {% set Z_HOP = 30 %}   # Raise bed 30mm — adjust if your Z is already high
    G91                    # relative mode
    G0 Z{Z_HOP} F1200      # lift bed
    G90                    # absolute mode
    G28 X Y                # home X and Y with bed raised → safe
    G0 X150 Y125 F10000    # optional: move to center after XY home
    G28 Z                  # now safe to home Z
    G0 Z10 F600            # raise a bit after
set_position_z: 0.0


[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 250

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650
hold_current: 0.500
stealthchop_threshold: 999999

[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[heater_fan controller_fan]
pin: PB15
heater: heater_bed
heater_temp: 45.0

[heater_fan nozzle_cooling_fan]
pin: PC7

[fan]
pin: PC6


[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>


######################################################################
#  BigTreeTech TFT TouchScreen emulated 12864 mode
######################################################################

[display]
lcd_type: emulated_st7920
spi_software_miso_pin: PD8 # status led, Virtual MISO
spi_software_mosi_pin: PD6
spi_software_sclk_pin: PB9
en_pin: PB8
encoder_pins: ^PA10, ^PA9
click_pin: ^!PA15

[output_pin beeper]
pin: PB5
[menu __main __network]
type: list
name: Network

[menu __main __network _mdns]
type: command
name: mDNS: {printer.network_status.mdns}

[menu __main __network _ethip]
type: command
name: Eth IP: {printer.network_status.ethip}

[menu __main __network _wifissid]
type: command
name: Wifi SSID: {printer.network_status.wifissid}

[menu __main __network _wifiip]
type: command
name: Wifi IP: {printer.network_status.wifiip}
