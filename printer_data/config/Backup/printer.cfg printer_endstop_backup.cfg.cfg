# This is a Klipper configuration for Qidi X-Plus, with
# V4.6 motherboard. Based on printer.cfg for X-Max by Funkton.

[include client_macros.cfg]
[include macros/Macros_StartEnd.cfg]
[include macros/Macros_Filament.cfg]
[include macros/Macros_ZLeveling.cfg]
[include macros/Macros_BedLeveling.cfg]
[include macros/Macros_FilamentChange.cfg]

#            === FIRMWARE BUILD ===
# 1. Enable extra low-level configuration options checkbox
# 2. Set MCU type to STMicroelectronics STM32
# 3. Choose processor model STM32F407
# 4. Set No bootloader option
# 5. For serial connection Uncheck USB, and leave default serial settings, USART1.
#     For USB option check box and leave defaults
# 6. For serial connection set Baud rate to 115200 (or adapter proferred). This value must match baud rate in printer.cfg file
# 7. Set (PE0, !PG10) as GPIO pins to set at startup. PE0 keeps on the power module and !PG10 turns on the board LED
# 8. Save changes and use make to build firmware.
# 9. Connect ST-LINK to mainboard SWD header and flash firmware.bin directly into user memory at 0x8000000

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3600590015504D5930393520-if00 # Run ls /dev/serial/by-id/* to find your board's ID
restart_method: command
# setup for PA9, PA10 USART1_tx / rx directly connected to the RPI GPIO TX / RX pins
# only connect GND, TX, RX - supply 5v power to the RPI separately
# cross over TX/RX
# Use "sudo raspi-config" to disable the serial terminal - but enable the serial port.
# Alternatively you can use the USB port for connection. USB port will require an A to A style cable.

[gcode_button power_button]
pin = ^PC13
press_gcode = 
	TOGGLE_PSU

[virtual_sdcard]
path: /opt/gcode

[display_status]

[pause_resume]

#Printer settings X-Plus ORIGINALY

# Advice: start with https://www.klipper3d.org/Config_checks.html - it contains checking the most essential sensors and steppers and PID-Tuning!

[input_shaper]  			# Advice: you have to run shaper-calibration specific for your own printer, see: https://www.klipper3d.org/Resonance_Compensation.html
#shaper_freq_x: 45
#shaper_freq_y: 45
#shaper_freq_x: 44.8
#shaper_freq_y: 42.4
#shaper_type: mzv

[printer]
kinematics: cartesian
max_velocity: 150
max_accel: 3500		        # Advice: you will set this specific for your own printer according to shaper-calibration, as above see: https://www.klipper3d.org/Resonance_Compensation.html
#max_accel: 7000
#max_accel_to_decel: 7000
max_z_velocity: 12
max_z_accel: 15
square_corner_velocity: 5.0

[force_move]
enable_force_move: true

#[stepper_x] THIS IS THE original
#step_pin: PB13
#dir_pin: PB12
#enable_pin: !PB14
#microsteps: 16
# rotation distance:
# 40 for 20T pulleys
# 32 for the original Qidi 16T pulleys
# 34 for 17T pulleys (sidenote: Funktons value for 17T: 33.984 (?))
#rotation_distance: 33.2 
#endstop_pin: ^!PC0
#position_endstop: 0
#position_min: 0
#position_max: 300
#homing_retract_dist: 10
#homing_speed: 20
#second_homing_speed: 10

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 33.2        # same as X on stock QIDI CoreXY
endstop_pin: ^!PC0              # stock Y limit switch
#microsteps: 16
#rotation_distance: 33.8
#position_endstop: 0
#position_max: 300
#homing_speed: 30
#endstop_pin: ^!PC0
position_endstop: 0
position_max: 300
homing_speed: 20
homing_retract_dist: 10

homing_positive_dir: False

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 16
# rotation distance:
# 40 for 20T pulleys
# 32 for the original Qidi 16T pulleys
# 34 for 17T pulleys (sidenote: Funktons value for 17T: 33.984 (?))
rotation_distance: 32
endstop_pin: !PC14
position_endstop: 250
position_max: 250
homing_retract_dist: 10
homing_speed: 20
second_homing_speed: 10

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 7.9672
endstop_pin: !PC2
position_endstop: 300			# advice: run Z-Leveling e.g. by macros/Macros_ZLeveling or following https://www.klipper3d.org/Manual_Level.html, this will set this value (at the end of this file)
position_max: 300				# warning - without correct z-leveling you will drive the nozzle into your bed
position_min: 0
homing_retract_dist: 5
homing_speed: 12
second_homing_speed: 1

#[stepper_z1]
#step_pin: PD12
#dir_pin: PG4
#enable_pin: !PG5
#microsteps: 16
#rotation_distance: 8
#endstop_pin: !PE6

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 4.358959806944  #was 4.71238898048 from Funktion; changed that value after flowcube measured at 0,37mm instaed 0,4mm
nozzle_diameter: 0.400
filament_diameter: 1.750
#FN 2021-11-19 with PETG blue => pressure_advance: 0.082
#pressure_advance: 0.082 		# Advice: run pressure Advance Tuning specific for your printer following https://www.klipper3d.org/Pressure_Advance.html
#pressure_advance_smooth_time: 0.02 #fn:commented out, user default
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
#   The chip select line for the sensor chip. This parameter must be
#   provided.
#spi_speed: 4000000
#   The SPI speed (in hz) to use when communicating with the chip.
#   The default is 4000000.
#spi_bus: spi2
#spi_software_sclk_pin:
#spi_software_mosi_pin:
#spi_software_miso_pin:
#   See the "common SPI settings" section for a description of the
#   above parameters.
min_extrude_temp: 170
min_temp: 0
max_temp: 300
max_extrude_only_distance: 300


[heater_bed]
