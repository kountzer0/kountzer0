############################

# EBB36 TOOLHEAD (CAN)

############################

[mcu EBB]
canbus_uuid: f343c0eac398
[adxl345]
cs_pin: EBB: PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z
[resonance_tester]
accel_chip: adxl345
probe_points: 175,120,20

############################

# THERMISTOR TABLE

############################

[thermistor Trianglelab-NTC100K-B3950]
temperature1: 25
resistance1: 103180
temperature2: 150
resistance2: 1366.2
temperature3: 250
resistance3: 168.6

############################

# EXTRUDER

############################

[extruder]
step_pin: EBB:PD0
dir_pin: EBB:PD1
enable_pin: !EBB:PD2
microsteps: 16
rotation_distance: 24.64
heater_pin: EBB:PB13
sensor_type: Trianglelab-NTC100K-B3950
sensor_pin: EBB:PA3
pressure_advance: 0.052
pressure_advance_smooth_time: 0.04
max_power: 1.0
nozzle_diameter: 0.4
filament_diameter: 1.75
#max_extrude_cross_section: 1.0
max_extrude_cross_section: 2.0
min_temp: 0
max_temp: 280

control: pid
pid_Kp: 18.174
pid_Ki: 0.762
pid_Kd: 108.359

[tmc2209 extruder]
uart_pin: EBB:PA15
run_current: 0.7
hold_current: 0.4
stealthchop_threshold: 0

############################

# HEATBREAK FAN (AUTO)

############################

[heater_fan heatbreak_fan]
pin: EBB:PA0
heater: extruder
heater_temp: 50
fan_speed: 1.0

############################

# PART COOLING FAN

############################

[fan]
pin: EBB:PA1

