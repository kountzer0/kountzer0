# QIDI X-Max 2 with BTT SKR Mini E3 V3.0 - Full Klipper Config Template
# Generated based on stock hardware and board pinout
# Adjust serial in [mcu], calibrate PIDs, and test thoroughly!
[include mainsail.cfg]

[gcode_button power_button]
pin = ^PC13
press_gcode = 
	TOGGLE_PSU

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3600590015504D5930393520-if00 # Run ls /dev/serial/by-id/* to find your board's ID
restart_method: command

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 7000  # Start at 3000-5000, tune with input shaper later
max_z_velocity: 25
max_z_accel: 300
square_corner_velocity: 5.0

[force_move]
enable_force_move: true

# Steppers (pins from your board diagram)
[stepper_x]
step_pin: PB13
dir_pin: !PB12  # Flip ! if homing direction wrong
enable_pin: !PB14
microsteps: 16
rotation_distance: 32  # Stock 16T GT2 pulleys; calibrate with test moves
endstop_pin: ^!PC0  # Stock X limit; try !^ if not triggering
position_endstop: 3
position_min: 0
position_max: 300
homing_retract_dist: 10
homing_speed: 10  # Lower for initial tests

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 32
endstop_pin: ^!PC1
position_endstop: 0
position_min: 0
position_max: 250
homing_speed: 30

[stepper_z]
step_pin: PB0
dir_pin: PC5  # Flip to !PC5 if Z direction inverted (bed should lower to home)
enable_pin: !PB1
microsteps: 16
rotation_distance: 8  # Stock Tr8x8 leadscrew
endstop_pin: ^!PC2  # Stock Z limit (bottom)
position_endstop: 0.0
position_min: 0
position_max: 300
homing_speed: 10
homing_retract_dist: 5

[homing_override]
axes: xyz
gcode:
    G28 X Y
    G0 Z10 F600
    G4 P100  # Wait for 100 milliseconds
    G28 Z
set_position_z: 0.0


# Extruder (stock QIDI direct drive)
[extruder]
step_pin: PB3
dir_pin: PB4  # Flip to !PB4 if extrusion direction wrong
enable_pin: !PD1
microsteps: 16
rotation_distance: 22.67  # Approximate for stock; CALIBRATE with e-steps test!
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: PC8  # Change from PB5 to PC8 (stock hotend heater pin HE0)
sensor_type: ATC Semitec 104NT-4-R025H42G  # Stock QIDI extruder thermistor
sensor_pin: PA0  # TEMP_0
control: pid
pid_Kp: 22.2  # Placeholder; run PID_CALIBRATE HEATER=extruder TARGET=210
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300  # Stock brass nozzle limit ~260; adjust for all-metal
pressure_advance: 0.05  # Tune later

# Heated Bed
[heater_bed]
heater_pin: PC9  # Change from PD2 to PC9 (stock bed heater pin BED_OUT)
sensor_type: Generic 3950  # Stock QIDI 100K NTC
sensor_pin: PC4  # TEMP_BED
control: pid
pid_Kp: 54.027  # Placeholder; run PID_CALIBRATE HEATER=heater_bed TARGET=60
pid_Ki: 0.770
pid_Kd: 945.475
min_temp: 0
max_temp: 120

# Fans (stock QIDI mappings to SKR pins)
[fan]  # Part cooling fan
pin: PC6  # Change from PA8 to PC6 (FAN0)
max_power: 1.0
kick_start_time: 0.5

[heater_fan hotend_fan]  # Hotend cooling fan (always on above 50C)
pin: PB15  # This is already correct (FAN1)
max_power: 1.0
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
[heater_fan controller_fan]
pin: PC7  # FAN2
max_power: 1.0
heater: extruder, heater_bed  # Runs when heaters are on
heater_temp: 45.0
fan_speed: 1.0

#[controller_fan controller_fan]  # Optional: Board cooling fan
#pin: PB9  # FAN2
#max_power: 1.0
#stepper: stepper_x, stepper_y, stepper_z  # Runs when steppers active

# Safe Homing Override (prevents gantry clashes)
[homing_override]
axes: xyz
gcode:
    {% set Z_HOP = 30 %}  # Raise bed for clearance
    G91  # Relative
    G0 Z{Z_HOP} F1200
    G90  # Absolute
    G28 X Y  # Home XY safely
    G0 X150 Y125 F10000  # Move to center (bed 300x250)
    G28 Z  # Home Z
    G0 Z10 F600  # Raise after
set_position_z: 0.0

# TMC Drivers (UART mode)
[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 1.0  # Stock ~0.9-1.0A; adjust if hot
stealthchop_threshold: 999999  # Quiet mode

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 1.0
hold_current: 0.5

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 1.2  # Higher for dual Z (parallel); monitor temps <60C
stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.8  # Stock extruder motor
stealthchop_threshold: 999999

# Bed Mesh (manual or for future probe; stock no probe)
#[bed_mesh]
#speed: 120
#horizontal_move_z: 5
#mesh_min: 20,20
#mesh_max: 280,230
#probe_count: 5,5

# Virtual SD Card (for gcode uploads)
[virtual_sdcard]
path: ~/printer_data/gcodes

# Display (optional: if connecting stock LCD; may need adapter)
#[display]
#lcd_type: st7920
#cs_pin: PB8
#sclk_pin: PB9
#sid_pin: PB10
#encoder_pins: ^PB7, ^PB6
#click_pin: ^!PB5

# Macros (examples; expand as needed)
[pause_resume]

[gcode_macro START_PRINT]
gcode:
    G28  # Home
    BED_MESH_PROFILE LOAD=default  # If using mesh
    G0 Z0.2 F3000  # etc.

[gcode_macro END_PRINT]
gcode:
    G91
    G1 Z10 F3000
    G90
    G28 X Y
    M84  # Disable steppers

# Include additional files if needed
#[include macros.cfg]  # For custom macros

# End of Config