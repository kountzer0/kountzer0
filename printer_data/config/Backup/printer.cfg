########################################
# MACHINE
########################################

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 100
square_corner_velocity: 5.0

########################################
# MCU
########################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3600590015504D5930393520-if00
restart_method: command

########################################
# X AXIS – SENSORLESS
########################################

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40

endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_min: 0
position_max: 300

homing_speed: 40
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.80
hold_current: 0.50
stealthchop_threshold: 0
diag_pin: ^PC0   <<< CHECK THIS >>>
driver_SGTHRS: 90

########################################
# Y AXIS – SENSORLESS
########################################

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40

endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 0
position_min: 0
position_max: 250

homing_speed: 35
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.90
hold_current: 0.50
stealthchop_threshold: 0
diag_pin: ^PC1   <<< CHECK THIS >>>
driver_SGTHRS: 95

########################################
# Z AXIS – PROBE HOMING
########################################

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8

endstop_pin: probe:z_virtual_endstop

position_min: -2
position_max: 300

homing_speed: 8
second_homing_speed: 3

########################################
# Z PROBE
########################################

[probe]
pin: ^PC14       <<< CHECK THIS >>>
x_offset: 0
y_offset: 0
z_offset: 0
speed: 5.0
samples: 2
samples_result: median
sample_retract_dist: 2

########################################
# SAFE Z HOME
########################################

[safe_z_home]
home_xy_position: 150,125
speed: 80
z_hop: 10
z_hop_speed: 10

########################################
# BED MESH (OPTIONAL, SAFE DEFAULT)
########################################

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 20,20
mesh_max: 280,230
probe_count: 5,5
algorithm: bicubic

########################################
# EXTRUDER (PLACEHOLDER)
########################################

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 7.0
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 280

########################################
# BED
########################################

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA1
control: pid
pid_Kp: 54.0
pid_Ki: 0.77
pid_Kd: 948
min_temp: 0
max_temp: 120

########################################
# FANS (SAFE DEFAULTS)
########################################

[fan]
pin: PC6

[heater_fan hotend_fan]
pin: PC7
heater: extruder
heater_temp: 50.0

########################################
# DISPLAY (DISABLED FOR NOW)
########################################
# Add later once motion is stable
